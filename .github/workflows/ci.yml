name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Dependency weight check
        run: node scripts/check-deps.mjs

      - name: Budget & telemetry replay
        run: npx tsx scripts/replay-budget.ts

      - name: Full system invariants
        run: npx tsx scripts/full-system-test.ts

      - name: Design / slop critic lint
        run: npx tsx scripts/design-lint.ts

      - name: Production build
        run: npm run build
